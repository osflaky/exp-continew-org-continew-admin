name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          distribution: temurin
          expander_leg: macos-latest--arm64
    name: Build and verify [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        # 统一使用 bash：Windows 默认的 PowerShell 找不到 sed，也无法执行 ./mvnw 脚本
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Remove repository mirrors
        # POM 中配置的国内镜像仓库在 CI 环境不稳定，构建前移除，改用 Maven Central
      run: |
        sed -i.bak '/<repositories>/,/<\/repositories>/d' pom.xml
        sed -i.bak '/<pluginRepositories>/,/<\/pluginRepositories>/d' pom.xml
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        java-version: 17
        distribution: ${{ matrix.distribution }}
        architecture: ${{ matrix.arch }}
        cache: maven
    - name: Build and verify
        # verify 触发完整门禁：Enforcer -> Spotless check -> Checkstyle (validate) -> 编译 -> SpotBugs (verify)
      run: ./mvnw -B verify
